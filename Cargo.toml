[package]
name = "hexstrike-rust"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
mcp-client = ["dep:rmcp"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
rmcp = { version = "=3.5.0", optional = true, features = ["client", "transport-child-process"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "control_plane"
harness = false
